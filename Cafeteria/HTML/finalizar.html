<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Finalizar Compra</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/finalizar.css">
</head>
<body>

    <main class="container py-5">
        <h1 class="text-center text-light mb-4">Finalizar Compra</h1>

        <p class="rotulo-total">Valor total</p>
        <p id="total-finalizar" class="text-center text-light fs-4 fw-bold"></p>

        <form id="pagamento" class="formulario-finalizacao w-75 mx-auto p-4 bg-white rounded-3 shadow-sm">
            <label for="nome" class="form-label">
                Nome completo
                <input id="nome" name="nome" type="text" class="form-control" autocomplete="name" required>
            </label>

            <label for="telefone" class="form-label">
                Telefone
                <input id="telefone" name="telefone" type="tel" class="form-control" autocomplete="tel" required>
            </label>

            <label for="forma-pagamento" class="form-label">
                Forma de pagamento
                <select id="forma-pagamento" name="forma-pagamento" class="form-select" required>
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="pix">Pix</option>
                    <option value="cartao">Cartão de Crédito</option>
                    <option value="dinheiro">Dinheiro</option>
                </select>
            </label>

            <label for="recebimento" class="form-label">
                Como deseja receber?
                <select id="recebimento" name="recebimento" class="form-select" required>
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="retirada">Retirada</option>
                    <option value="entrega">Entrega</option>
                </select>
            </label>

            <fieldset id="dados-entrega" class="endereco-entrega linha-completa" hidden>
                <legend>Endereço para entrega</legend>

                <label for="endereco" class="form-label">
                    Rua ou avenida
                    <input id="endereco" name="endereco" type="text" class="form-control" autocomplete="street-address">
                </label>

                <label for="numero" class="form-label">
                    Número
                    <input id="numero" name="numero" type="text" class="form-control">
                </label>
            </fieldset>

            <button type="submit" class="btn btn-dark">
                Finalizar compra
            </button>

            <a href="index.html" class="btn btn-outline-dark">
                Voltar para a Loja
            </a>

            <p id="status-pedido" class="linha-completa" role="status" aria-live="polite"></p>
        </form>
    </main>
<script src = "../js/finalizar.js"></script>
</body>
</html>
